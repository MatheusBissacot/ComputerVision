# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: ./ # dataset root dir (absolute or relative; if relative, it's relative to default datasets_dir)
train: images/train # train images (relative to 'path') 4 images
val: images/val # val images (relative to 'path') 4 images
test: images/test # test images (optional)

# Classes (80 COCO classes)
names:
    0: white-pawn
    1: white-rook
    2: white-knight
    3: white-bishop
    4: white-queen
    5: white-king
    6: black-pawn
    7: black-rook
    8: black-knight
    9: black-bishop
    10: black-queen
    11: black-king
    12: empty
    13: chess-board